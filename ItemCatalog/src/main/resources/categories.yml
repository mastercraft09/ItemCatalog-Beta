  miscellaneous:
    display-name: "&7&lMiscellaneous"
    icon: "CHEST"
    order: 99
    enabled: true

# ----------------------------------------------------------------
#  Native-category mapping (CategoryResolver priority 2)
#
#  Maps a provider's own raw category (MMOItems Type, Oraxen/ItemsAdder
#  category) onto one of your categories/subcategories above. Anything not
#  listed falls through to auto-classify, then miscellaneous.
#
#  Left empty by default: every MMOItems Type shows up as its own category
#  automatically, with zero setup needed. Only add an entry here to merge a
#  Type into one of the manual categories above instead. Example:
#
#  native-category-mappings:
#    mmoitems:
#      SWORD: { category: weapons, sub-category: swords }
#      AXE: { category: weapons, sub-category: axes }
#      BOW: { category: weapons, sub-category: bows }
native-category-mappings:
  mmoitems: { }
  oraxen: { }
  itemsadder: { }
  executableitems: { }
